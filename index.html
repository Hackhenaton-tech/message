<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5A3825">
<title>Pour Shakira 💕</title>
<style>
  :root {
    --bg: #5A3825;
    --text: #FFFFFF;
    --cream: #F6EADF;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; margin: 0; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255,214,190,.20), transparent 60%),
      radial-gradient(90% 70% at 50% 110%, rgba(0,0,0,.30), transparent 65%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    overflow-x: hidden;
  }

  /* cœurs qui flottent doucement en fond */
  #floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .floater { position: absolute; bottom: -40px; color: var(--cream); opacity: 0; animation: drift linear infinite; }
  @keyframes drift {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: var(--o); }
    100% { transform: translateY(-112vh) rotate(var(--r)); opacity: 0; }
  }

  .screen { display: none; text-align: center; max-width: 460px; width: 100%; position: relative; z-index: 1; }
  .screen.active { display: block; animation: enter .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  h1 { font-size: clamp(32px, 9vw, 46px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin: 0 0 16px; text-wrap: balance; }
  p  { font-size: 18px; line-height: 1.5; margin: 0 0 34px; opacity: .88; text-wrap: balance; }

  /* ---------- Enveloppe (écran 1) ---------- */
  .envelope {
    all: unset; cursor: pointer; display: block; margin: 0 auto 38px;
    width: 236px; height: 160px; position: relative;
    filter: drop-shadow(0 22px 28px rgba(0,0,0,.38));
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .envelope:focus-visible { outline: 3px solid var(--text); outline-offset: 10px; border-radius: 12px; }
  .env-back { position: absolute; inset: 0; background: #E4D0BF; border-radius: 12px; }
  .env-letter {
    position: absolute; left: 16px; right: 16px; top: 14px; height: 120px;
    background: #FFFBF6; border-radius: 8px; transition: transform .8s cubic-bezier(.2,.8,.2,1) .35s;
  }
  .env-letter::before, .env-letter::after {
    content: ""; position: absolute; left: 18px; height: 5px; border-radius: 3px; background: rgba(90,56,37,.18);
  }
  .env-letter::before { top: 22px; width: 56%; }
  .env-letter::after  { top: 38px; width: 38%; }
  .env-front {
    position: absolute; inset: 0; border-radius: 12px;
    background: linear-gradient(160deg, #F6EADF, #EAD6C4);
    clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 62%;
    background: linear-gradient(180deg, #EFDDCC, #DCC3AE);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top; transition: transform .7s cubic-bezier(.4,0,.2,1);
    border-radius: 12px 12px 0 0;
  }
  .env-seal {
    position: absolute; left: 50%; top: 52%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #C9564B, #8E2B28);
    display: grid; place-items: center; color: #FFE9E2; font-size: 21px; line-height: 1;
    box-shadow: 0 4px 10px rgba(0,0,0,.35); transition: opacity .3s ease; animation: beat 1.8s ease-in-out infinite;
  }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } }
  .envelope.opening { animation: none; }
  .envelope.opening .env-flap { transform: rotateX(180deg); }
  .envelope.opening .env-seal { opacity: 0; animation: none; }
  .envelope.opening .env-letter { transform: translateY(-62px); }
  .envelope.leaving { transition: transform .6s ease, opacity .6s ease; transform: translateY(-20px) scale(.9); opacity: 0; }
  .tap { font-size: 15px; opacity: .65; margin: 0; }

  /* ---------- Boutons ---------- */
  .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  button.btn {
    font-family: var(--font); font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
    border: 0; border-radius: 999px; padding: 16px 38px; cursor: pointer; min-width: 132px;
    transition: transform .15s ease, box-shadow .2s ease, background .2s ease;
  }
  button.btn:active { transform: scale(.96); }
  button.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  .primary { background: var(--cream); color: var(--bg); box-shadow: 0 10px 26px rgba(0,0,0,.28), 0 0 0 0 rgba(246,234,223,.5); }
  .primary:hover { box-shadow: 0 12px 30px rgba(0,0,0,.32); }
  #yes { animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 10px 26px rgba(0,0,0,.28), 0 0 0 10px rgba(246,234,223,.0), 0 0 22px rgba(246,234,223,.35); } }
  .secondary { background: transparent; color: var(--text); border: 1.5px solid rgba(255,255,255,.4); }
  .secondary:hover { background: rgba(255,255,255,.1); }

  /* ---------- Écran du mot ---------- */
  .big-heart { width: 74px; height: 74px; margin: 0 auto 22px; display: block; color: var(--cream); animation: beat 1.8s ease-in-out infinite; filter: drop-shadow(0 8px 16px rgba(0,0,0,.3)); }
  .note {
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.22);
    border-radius: 22px; padding: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  textarea {
    width: 100%; min-height: 110px; resize: none; display: block;
    font-family: var(--font); font-size: 17px; line-height: 1.45; color: var(--text);
    background: transparent; border: 0; padding: 6px 6px 12px; outline: none;
  }
  textarea::placeholder { color: var(--text); opacity: .55; }
  .note .btn { width: 100%; padding: 14px 20px; font-size: 17px; }
  .note:focus-within { border-color: rgba(255,255,255,.55); }

  /* cœurs de célébration */
  .heart { position: fixed; bottom: -40px; font-size: 28px; pointer-events: none; z-index: 5; animation: rise 3.2s ease-in forwards; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .screen.active, .envelope, .env-seal, #yes, .big-heart { animation: none; }
    #floaters { display: none; }
  }
</style>
</head>
<body>

<div id="floaters" aria-hidden="true"></div>

<!-- Écran 1 : enveloppe (le tap lance aussi la musique) -->
<section class="screen active" id="s1">
  <button class="envelope" id="open" aria-label="Ouvrir la lettre">
    <span class="env-back"></span>
    <span class="env-letter"></span>
    <span class="env-front"></span>
    <span class="env-flap"></span>
    <span class="env-seal">♥</span>
  </button>
  <h1 id="t-intro"></h1>
  <p id="t-sub"></p>
  <p class="tap" id="t-open"></p>
</section>

<!-- Écran 2 : la question -->
<section class="screen" id="s2">
  <h1 id="t-question"></h1>
  <p id="t-shy"></p>
  <div class="row">
    <button class="btn primary" id="yes"></button>
    <button class="btn secondary" id="no"></button>
  </div>
</section>

<!-- Écran 3 : réponse oui + petit mot -->
<section class="screen" id="s3">
  <svg class="big-heart" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.6 1.1 5.6 3.2 2-2.1 3.5-3.2 5.6-3.2 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
  <h1 id="t-yes"></h1>
  <p id="t-yes-sub"></p>
  <div class="note" id="wordBox">
    <textarea id="word" maxlength="500" aria-label="Un mot pour Joel"></textarea>
    <button class="btn primary" id="sendWord"></button>
  </div>
  <p id="thanks" style="display:none"></p>
</section>

<!-- Écran 4 : réponse non -->
<section class="screen" id="s4">
  <svg class="big-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.5 6.4 4.5c2.1 0 3.6 1.1 5.6 3.2 2-2.1 3.5-3.2 5.6-3.2 3.7 0 5.5 3.9 4 7.3C19.5 16.4 12 21 12 21z"/></svg>
  <h1 id="t-no"></h1>
  <p id="t-no-sub"></p>
</section>

<audio id="song" src="ordinary.mp3" loop preload="auto"></audio>

<script>
/* ========== À MODIFIER ========== */
const CONFIG = {
  // Couleurs
  bg: "#5A3825",
  text: "#FFFFFF",

  // Textes
  intro:    "Salut Shakira 👋",
  sub:      "Joel est un peu timide, alors il a codé cette petite page juste pour toi.",
  openBtn:  "Touche l'enveloppe pour l'ouvrir",
  question: "Will you go out with me? 💕",
  shy:      "Un vrai date, rien que nous deux.",
  yesBtn:   "Yes 💖",
  noBtn:    "No",
  yesTitle: "Olalala",
  yesSub:   "Bahhh merci d'avoir dit oui, Shakira.  Je te réponds très vite, promis.",
  wordPlaceholder: "Un mot pour Joel ?",
  wordBtn:  "Envoyer à Joel 💌",
  thanks:   "Merci 💕 Joel va le lire très vite.",
  noTitle:  "Pas de souci 🤍",
  noSub:    "Merci d'avoir été honnête, Joel respecte ça.",

  // Où arrive la réponse (aucun PHP nécessaire) :
  // 1) Formspree : crée un formulaire gratuit sur formspree.io et colle l'URL ici (ex: "https://formspree.io/f/xxxxxxx")
  formEndpoint: "https://formspree.io/f/xdeanbjy",
  // 2) OU WhatsApp : numéro de Joel au format international sans + ni espaces (ex: "33612345678")
  whatsappNumber: ""
};
/* ================================ */

const $ = id => document.getElementById(id);
const root = document.documentElement.style;
root.setProperty("--bg", CONFIG.bg);
root.setProperty("--text", CONFIG.text);
$("t-intro").textContent = CONFIG.intro;
$("t-sub").textContent = CONFIG.sub;
$("t-open").textContent = CONFIG.openBtn;
$("t-question").textContent = CONFIG.question;
$("t-shy").textContent = CONFIG.shy;
$("yes").textContent = CONFIG.yesBtn;
$("no").textContent = CONFIG.noBtn;
$("t-yes").textContent = CONFIG.yesTitle;
$("t-yes-sub").textContent = CONFIG.yesSub;
$("word").placeholder = CONFIG.wordPlaceholder;
$("sendWord").textContent = CONFIG.wordBtn;
$("t-no").textContent = CONFIG.noTitle;
$("t-no-sub").textContent = CONFIG.noSub;

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

// Cœurs doux qui flottent en fond
(function () {
  const box = $("floaters");
  for (let i = 0; i < 16; i++) {
    const f = document.createElement("span");
    f.className = "floater";
    f.textContent = "♥";
    f.style.left = Math.random() * 100 + "vw";
    f.style.fontSize = (10 + Math.random() * 18) + "px";
    f.style.animationDuration = (14 + Math.random() * 14) + "s";
    f.style.animationDelay = (-Math.random() * 20) + "s";
    f.style.setProperty("--o", (0.08 + Math.random() * 0.16).toFixed(2));
    f.style.setProperty("--r", (Math.random() * 80 - 40) + "deg");
    box.appendChild(f);
  }
})();

// Ouverture de l'enveloppe + musique (les navigateurs exigent un tap avant de lancer le son)
$("open").addEventListener("click", () => {
  const env = $("open");
  if (env.classList.contains("opening")) return;
  const a = $("song");
  a.volume = 0.6;
  a.play().catch(() => {});
  env.classList.add("opening");
  setTimeout(() => env.classList.add("leaving"), 1250);
  setTimeout(() => show("s2"), 1750);
});

// Cœurs de célébration
function hearts() {
  for (let i = 0; i < 24; i++) {
    setTimeout(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = ["💕", "💖", "💗", "❤️"][i % 4];
      h.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 3300);
    }, i * 120);
  }
}

// Envoi de la réponse
async function send(message, answer, openWhatsApp) {
  if (CONFIG.formEndpoint) {
    try {
      await fetch(CONFIG.formEndpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({ reponse: answer, message })
      });
      return;
    } catch (e) { /* on tente WhatsApp ensuite */ }
  }
  if (openWhatsApp && CONFIG.whatsappNumber) {
    window.open("https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(message), "_blank");
  }
}

$("yes").addEventListener("click", () => {
  show("s3");
  hearts();
  // avec Formspree, le oui part tout de suite ; avec WhatsApp, il part avec le petit mot
  send("Shakira a dit OUI 💕", "OUI", false);
});

$("sendWord").addEventListener("click", () => {
  const word = $("word").value.trim();
  const message = "Shakira a dit OUI 💕" + (word ? "\n\nSon mot : " + word : "");
  send(message, "MOT", true);
  $("wordBox").style.display = "none";
  $("thanks").textContent = CONFIG.thanks;
  $("thanks").style.display = "block";
});

$("no").addEventListener("click", () => {
  show("s4");
  send("Shakira a répondu non, mais merci d'avoir demandé 🤍", "NON", true);
});
</script>
</body>
</html>
